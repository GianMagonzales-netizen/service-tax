<div class="login-page">

  <section class="hero-section">
    <div class="brand-box">

      <div class="brand-logo">
        T
      </div>

      <h1>TAXI</h1>

      <p>
        Tu <span>destino</span>,<br>
        nuestra prioridad
      </p>

    </div>
  </section>

  <section class="login-panel">

    <div class="login-card">

      <div class="card-indicator"></div>

      <div class="user-icon">
        👤
      </div>

      <h2>Bienvenido</h2>

      <p class="subtitle">
        Inicia sesión para continuar
      </p>

      <form (ngSubmit)="onLogin()">

        <div class="input-group">

          <input
            type="email"
            placeholder="Correo electrónico"
            [(ngModel)]="email"
            name="email"
            autocomplete="email"
            required
          >

        </div>

        <div class="input-group">

          <input
            type="password"
            placeholder="Contraseña"
            [(ngModel)]="password"
            name="password"
            autocomplete="current-password"
            required
          >

        </div>

        <div class="forgot-password">
          <a href="/forgot-password">
            ¿Olvidaste tu contraseña?
          </a>
        </div>

        <p
          class="error"
          *ngIf="errorMessage"
        >
          {{ errorMessage }}
        </p>

        <button
          class="login-btn"
          type="submit"
        >
          <span>Iniciar sesión</span>
          <span>→</span>
        </button>

      </form>

      <div class="divider">
        <span></span>

        <p>
          O continúa con
        </p>

        <span></span>
      </div>

      <div class="social-login">

        <button
          type="button"
          class="social-btn google"
        >
          <img
            src="/icons/google.png"
            alt="Google"
          >
        </button>

        <button
          type="button"
          class="social-btn"
        >
          <img
            src="/icons/apple.png"
            alt="Apple"
          >
        </button>

        <button
          type="button"
          class="social-btn"
        >
          <img
            src="/icons/facebook.png"
            alt="Facebook"
          >
        </button>

      </div>

      <p class="register-text">
        ¿No tienes cuenta?

        <a routerLink="/register">
          Regístrate
        </a>
      </p>

    </div>

  </section>

</div>
