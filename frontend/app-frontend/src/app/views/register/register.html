<div class="register-page">
  <div class="background-overlay"></div>

  <section class="brand-section">
    <div class="brand-content">
      <div class="logo-box">T</div>

      <h1>TAXI</h1>

      <p>
        Tu <strong>destino</strong>,<br />
        nuestra prioridad
      </p>
    </div>
  </section>

  <section class="register-section">
    <div class="register-card">
      <div class="top-line"></div>

      <div class="user-icon">👤</div>

      <h2>Crear cuenta</h2>
      <p class="subtitle">
        Regístrate para comenzar
      </p>

      <form
        #registerForm="ngForm"
        (ngSubmit)="onRegister()"
      >
        <div class="two-columns">
          <div class="form-group">
            <label for="nombre">
              Nombre *
            </label>

            <input
              id="nombre"
              name="nombre"
              type="text"
              [(ngModel)]="nombre"
              placeholder="Nombre"
              autocomplete="given-name"
              required
            />
          </div>

          <div class="form-group">
            <label for="apellido">
              Apellido
            </label>

            <input
              id="apellido"
              name="apellido"
              type="text"
              [(ngModel)]="apellido"
              placeholder="Apellido"
              autocomplete="family-name"
            />
          </div>
        </div>

        <div class="form-group">
          <label for="email">
            Correo electrónico *
          </label>

          <input
            id="email"
            name="email"
            type="email"
            [(ngModel)]="email"
            placeholder="correo@ejemplo.com"
            autocomplete="email"
            required
          />
        </div>

        <div class="form-group">
          <label for="telefono">
            Teléfono
          </label>

          <input
            id="telefono"
            name="telefono"
            type="tel"
            [(ngModel)]="telefono"
            placeholder="987654321"
            autocomplete="tel"
            inputmode="numeric"
          />
        </div>

        <div class="two-columns">
          <div class="form-group">
            <label for="password">
              Contraseña *
            </label>

            <input
              id="password"
              name="password"
              type="password"
              [(ngModel)]="password"
              placeholder="Mínimo 6 caracteres"
              autocomplete="new-password"
              required
              minlength="6"
            />
          </div>

          <div class="form-group">
            <label for="confirmPassword">
              Confirmar contraseña *
            </label>

            <input
              id="confirmPassword"
              name="confirmPassword"
              type="password"
              [(ngModel)]="confirmPassword"
              placeholder="Repite tu contraseña"
              autocomplete="new-password"
              required
            />
          </div>
        </div>

        <div class="form-group">
          <label for="rol">
            Tipo de cuenta *
          </label>

          <select
            id="rol"
            name="rol"
            [(ngModel)]="rol"
            required
          >
            <option value="CLIENT">
              Pasajero
            </option>

            <option value="DRIVER">
              Conductor
            </option>
          </select>
        </div>

        <p
          *ngIf="errorMessage"
          class="message error-message"
        >
          {{ errorMessage }}
        </p>

        <p
          *ngIf="successMessage"
          class="message success-message"
        >
          {{ successMessage }}
        </p>

        <button
          type="submit"
          class="register-button"
          [disabled]="isLoading"
        >
          <span>
            {{
              isLoading
                ? 'Creando cuenta...'
                : 'Crear cuenta'
            }}
          </span>

          <span *ngIf="!isLoading">→</span>
        </button>
      </form>

      <p class="login-link">
        ¿Ya tienes una cuenta?

        <a routerLink="/login">
          Inicia sesión
        </a>
      </p>
    </div>
  </section>
</div>
