<div class="auth-page">

  <div class="auth-card">

    <div class="auth-header">
      <div class="icon">🔑</div>

      <h1>Recuperar contraseña</h1>

      <p>
        Ingresa el correo asociado a tu cuenta.
        Te enviaremos un código de recuperación.
      </p>
    </div>

    <form
      #forgotForm="ngForm"
      (ngSubmit)="sendCode()"
    >

      <label for="email">
        Correo electrónico
      </label>

      <input
        id="email"
        name="email"
        type="email"
        placeholder="correo@gmail.com"
        autocomplete="email"
        [(ngModel)]="email"
        required
      >

      <div
        class="error-message"
        *ngIf="errorMessage"
      >
        {{ errorMessage }}
      </div>

      <div
        class="success-message"
        *ngIf="successMessage"
      >
        {{ successMessage }}
      </div>

      <button
        type="submit"
        [disabled]="loading"
      >
        {{
        loading
        ? 'Enviando...'
        : 'Enviar código'
        }}
      </button>

    </form>

    <a
      routerLink="/login"
      class="back-link"
    >
      Volver al inicio de sesión
    </a>

  </div>

</div>
