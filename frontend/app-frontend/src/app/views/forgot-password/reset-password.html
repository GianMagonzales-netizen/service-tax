<div class="auth-page">

  <div class="auth-card">

    <div class="auth-header">
      <div class="icon">🔒</div>

      <h1>Nueva contraseña</h1>

      <p>
        Ingresa el código enviado a:
      </p>

      <strong>{{ email }}</strong>
    </div>

    <form
      #resetForm="ngForm"
      (ngSubmit)="resetPassword()"
    >

      <label for="codigo">
        Código de recuperación
      </label>

      <input
        id="codigo"
        name="codigo"
        type="text"
        inputmode="numeric"
        maxlength="6"
        autocomplete="one-time-code"
        placeholder="000000"
        class="code-input"
        [(ngModel)]="codigo"
        (input)="onlyNumbers($event)"
        required
      >

      <label for="nuevaPassword">
        Nueva contraseña
      </label>

      <div class="password-wrapper">
        <input
          id="nuevaPassword"
          name="nuevaPassword"
          [type]="showPassword ? 'text' : 'password'"
          placeholder="Mínimo 8 caracteres"
          autocomplete="new-password"
          [(ngModel)]="nuevaPassword"
          minlength="8"
          required
        >

        <button
          type="button"
          class="toggle-button"
          (click)="showPassword = !showPassword"
        >
          {{ showPassword ? 'Ocultar' : 'Ver' }}
        </button>
      </div>

      <label for="confirmarPassword">
        Confirmar contraseña
      </label>

      <div class="password-wrapper">
        <input
          id="confirmarPassword"
          name="confirmarPassword"
          [type]="showConfirmPassword ? 'text' : 'password'"
          placeholder="Repite la contraseña"
          autocomplete="new-password"
          [(ngModel)]="confirmarPassword"
          required
        >

        <button
          type="button"
          class="toggle-button"
          (click)="
            showConfirmPassword =
              !showConfirmPassword
          "
        >
          {{
          showConfirmPassword
          ? 'Ocultar'
          : 'Ver'
          }}
        </button>
      </div>

      <div
        class="error-message"
        *ngIf="errorMessage"
      >
        {{ errorMessage }}
      </div>

      <div
        class="success-message"
        *ngIf="successMessage"
      >
        {{ successMessage }}
      </div>

      <button
        type="submit"
        class="main-button"
        [disabled]="loading"
      >
        {{
        loading
        ? 'Actualizando...'
        : 'Cambiar contraseña'
        }}
      </button>

    </form>

    <button
      type="button"
      class="resend-button"
      (click)="resendCode()"
    >
      Reenviar código
    </button>

    <a
      routerLink="/login"
      class="back-link"
    >
      Volver al inicio de sesión
    </a>

  </div>

</div>
